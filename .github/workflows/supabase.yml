name: Supabase

# Database changes go live from GitHub, nobody needs to run SQL by hand after the first setup.
#
# - Pull request that touches supabase/: "check" starts a fresh local Supabase database in the runner
#   and applies every file in supabase/migrations/ in order. A broken migration fails here, before merge.
# - Merge to main (or "Run workflow" on the Actions tab): "deploy" applies the migrations the live
#   project has not had yet (supabase db push), then deploys the edge functions in supabase/functions/.
#
# Repository secrets (Settings > Secrets and variables > Actions), see docs/supabase-deploy.md:
#   SUPABASE_ACCESS_TOKEN  personal access token from supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   the project's database password
#   SUPABASE_PROJECT_REF   optional, defaults to Dorma's project uhytsroauemdkuanwdoh

on:
  pull_request:
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  push:
    branches: [main]
    paths: ['supabase/**', '.github/workflows/supabase.yml']
  workflow_dispatch:

# Never run two deploys against the live database at the same time.
concurrency:
  group: supabase-${{ github.event_name == 'pull_request' && github.ref || 'live' }}
  cancel-in-progress: false

env:
  SUPABASE_CLI_VERSION: 2.122.1

jobs:
  check:
    name: Check migrations on a fresh database
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        # --node-modules-dir=none: fetch npm: imports directly (the site's node_modules is not installed in this job)
        run: for f in supabase/functions/*/index.ts; do deno check --node-modules-dir=none "$f"; done
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Apply all migrations to a local Supabase database
        run: supabase db start
      - name: Show applied migrations
        run: supabase migration list --local
      - name: Stop
        if: always()
        run: supabase stop --no-backup

  deploy:
    name: Apply migrations to live
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'uhytsroauemdkuanwdoh' }}
    steps:
      - name: Check secrets
        run: |
          missing=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || missing="$missing SUPABASE_ACCESS_TOKEN"
          [ -n "$SUPABASE_DB_PASSWORD" ] || missing="$missing SUPABASE_DB_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing. See docs/supabase-deploy.md."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Link the live project
        run: supabase link --project-ref "$PROJECT_REF"
      # One-time baseline, safe to repeat: 0001 was run by hand in the SQL Editor when the project
      # was set up (2026-11-24). This marks it as applied without running it again.
      # Do not add newer migrations here: "db push" below applies them.
      - name: Baseline migration history (hand-run 0001)
        run: supabase migration repair --linked --status applied 0001
      - name: Migrations still to apply
        run: supabase db push --linked --dry-run
      - name: Apply new migrations
        run: supabase db push --linked --yes
      - name: Migration history now
        run: supabase migration list --linked
      # Edge functions (supabase/functions/*): the studio's "Write with AI" (ai-write).
      # Its Gemini key is an edge function secret set once in the Supabase dashboard, never in the repo.
      - name: Deploy edge functions
        run: |
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            echo "Deploying $name"
            supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api
          done
